<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Fazer Registro</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="card shadow p-4" style="width: 100%; max-width: 500px;">
    <h1 class="text-center mb-4">Registro</h1>
    <legend class="mb-3">Fazer Registro:</legend>

    <form th:action="@{/registro}" method="post" th:object="${registro}">

        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" th:field="*{nome}" placeholder="Nome"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <div class="input-group">
                <span class="input-group-text">@</span>
                <input type="email" class="form-control" th:field="*{email}" placeholder="Email"/>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Senha</label>
            <div class="input-group">
                <input type="password" class="form-control" id="inputSenha"
                       th:field="*{senha}" placeholder="Senha"/>
                <button type="button" class="btn btn-outline-secondary" onclick="toggleSenha()">
                    <i id="eyeIcon" class="bi bi-eye"></i>
                </button>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">Confirmar Senha</label>
            <div class="input-group">
                <input type="password" class="form-control" id="inputConfirmar"
                       th:field="*{comfirmarSenha}" placeholder="Confirmar Senha"/> 
                <button type="button" class="btn btn-outline-secondary" onclick="toggleSenha()">
                    <i id="eyeIcon" class="bi bi-eye"></i>
                </button>
            </div>
        </div>

        <div class="d-grid mb-2">
            <button type="submit" class="btn btn-dark">Registrar</button>
        </div>

    </form>

    <div class="text-end mt-2">
        <a th:href="@{/logar}" class="text-decoration-none">Já possui registro?</a>
    </div>
</div>

<script>
    function toggleSenha() {
        const senha = document.getElementById('inputSenha');
        const confirmar = document.getElementById('inputConfirmar');
        const icon = document.getElementById('eyeIcon');
        const tipo = senha.type === 'password' ? 'text' : 'password';
        senha.type = tipo;
        confirmar.type = tipo;
        icon.className = tipo === 'text' ? 'bi bi-eye-slash' : 'bi bi-eye';
    }
</script>

</body>
</html>
