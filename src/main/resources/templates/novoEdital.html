<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Criar Novo Edital</title>
    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/Layout :: custom-header}"></div>

    <div class="d-flex align-items-start justify-content-center mt-5">
        <div class="col-md-6">

            <h4 class="mb-4">Criar Novo Edital</h4>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/novoEdital}" th:object="${editalBean}" method="post">
                <div class="mb-3">
                    <label for="titulo" class="form-label fw-bold">Título</label>
                    <input type="text" class="form-control" id="titulo" th:field="*{titulo}"
                           placeholder="Ex:Compra de Equipamentos" required/>
                </div>
                <div class="mb-3">
                    <label for="descricao" class="form-label fw-bold">Descrição</label>
                    <textarea class="form-control" id="descricao" th:field="*{descricao}" rows="4"
                              placeholder="Detalhes do edital" required></textarea>
                </div>
                <div class="mb-4">
                    <label for="data_fechamento" class="form-label fw-bold">Data e Hora de Fechamento</label>
                    <input type="datetime-local" class="form-control" id="data_fechamento" name="data_fechamento" required>
                </div>
                <div class="d-flex justify-content-between">
                    <a th:href="@{/}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Salvar Edital</button>
                </div>
            </form>

        </div>
    </div>

    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
