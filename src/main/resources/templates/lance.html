<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Lance</title>
    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>

    <div th:replace="~{fragments/Layout :: custom-header}"></div>

    <div class="d-flex align-items-start justify-content-center mt-5">
        <div class="col-md-6">

            <h4 class="mb-4">Registrar Lance</h4>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/lance/{id}(id=${id})}" th:object="${lancesBean}" method="post">
                <div class="mb-3">
                    <label for="valor" class="form-label fw-bold">Valor do Lance</label>
                    <input type="number" step="0.01" class="form-control" id="valor" th:field="*{valor}"
                           placeholder="Ex: 1500.00" required/>
                </div>
                <div class="d-flex justify-content-between">
                    <a th:href="@{/editais}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Registrar Lance</button>
                </div>
            </form>

        </div>
    </div>

    <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
