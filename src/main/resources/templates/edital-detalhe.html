<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalhe do Edital</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}"/>
</head>
<body>
    <div th:replace="~{fragments/Layout :: custom-header}"></div>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <div class="card shadow-sm mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Detalhe do Edital</h5>
                        <a th:href="@{/editais}" class="btn btn-secondary btn-sm">Voltar</a>
                    </div>
                    <div class="card-body">
                        <dl class="row">
                            <dt class="col-sm-3">ID</dt>
                            <dd class="col-sm-9" th:text="${edital.id}"></dd>
                            <dt class="col-sm-3">Título</dt>
                            <dd class="col-sm-9" th:text="${edital.titulo}"></dd>
                            <dt class="col-sm-3">Descrição</dt>
                            <dd class="col-sm-9" th:text="${edital.descricao}"></dd>
                            <dt class="col-sm-3">Data Fechamento</dt>
                            <dd class="col-sm-9" th:text="${#temporals.format(edital.data_fechamento, 'dd/MM/yyyy HH:mm')}"></dd>
                            <dt class="col-sm-3">Status</dt>
                            <dd class="col-sm-9">
                                <span th:classappend="${edital.status == 'ABERTO'} ? 'badge bg-success' : 'badge bg-danger'"
                                      th:text="${edital.status}">
                                </span>
                            </dd>
                        </dl>
                    </div>
                </div>

                <div class="card shadow-sm" th:if="${edital.status == 'ABERTO'}">
                    <div class="card-header">
                        <h5 class="mb-0">Registrar Lance</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
                        <form th:action="@{/lance/{id}(id=${edital.id})}" method="post">
                            <div class="mb-3">
                                <label for="valor" class="form-label fw-bold">Valor do Lance</label>
                                <div class="input-group">
                                    <span class="input-group-text">R$</span>
                                    <input type="number" step="0.01" min="0" class="form-control"
                                           id="valor" name="valor" placeholder="0,00" required/>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary">Enviar Lance</button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
